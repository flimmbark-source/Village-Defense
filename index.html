<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Grimm Dominion</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Inline critical styles for layout */
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1a1a2e;
            color: #e5e7eb;
        }
        body {
            display: flex;
            flex-direction: column;
            padding: 8px;
            padding: env(safe-area-inset-top, 8px) env(safe-area-inset-right, 8px) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 8px);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #gameContainer {
            flex-grow: 1;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Game Container -->
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- Hero UI (Bottom Left) -->
        <div id="heroPanel">
            <div class="hero-stats ui-panel">
                <!-- Gold -->
                <div class="stat-row">
                    <span class="stat-label gold font-medieval">Gold</span>
                    <span id="heroGoldText" class="stat-value gold">0</span>
                </div>
            </div>
        </div>

        <!-- Level Up Animation Overlay -->
        <div id="levelUpAnimation" class="hidden">
            <div class="level-up-text font-medieval">LEVEL UP!</div>
        </div>

        <!-- Tavern Shop Animation Overlay -->
        <div id="tavernAnimation" class="hidden">
            <div class="tavern-popup">
                <div class="tavern-title font-medieval">TAVERN OPEN</div>
            </div>
        </div>

        <!-- Level Up Choice Panel (3 cards or skip) -->
        <div id="levelUpChoicePanel" class="hidden">
            <div class="shop-overlay"></div>
            <div class="levelup-choice-content">
                <!-- Normal Reward View -->
                <div id="normalRewardView">
                    <button class="reward-info-btn" id="rewardInfoBtn" title="View Details">Info</button>
                    <h2 class="font-medieval levelup-choice-title">Choose a Reward</h2>
                    <div id="levelUpChoiceCards" class="levelup-choice-cards">
                        <!-- 3 random cards populated by JS -->
                    </div>
                    <button id="levelUpSkipBtn" class="game-button levelup-skip-btn">Skip (+30 🪙)</button>
                </div>

                <!-- Expanded Reward View (hidden by default) -->
                <div id="expandedRewardView" class="expanded-reward-view hidden">
                    <div class="expanded-reward-header">
                        <button class="reward-collapse-btn" id="collapseRewardBtn" title="Back">Back</button>
                        <h3 class="expanded-reward-title font-medieval">Choose a Reward</h3>
                    </div>
                    <div id="expandedRewardCards" class="expanded-reward-cards">
                        <!-- Extended cards populated by JS -->
                    </div>
                    <button id="levelUpSkipBtnExpanded" class="game-button levelup-skip-btn-expanded">Skip (+30 🪙)</button>
                </div>
            </div>
        </div>

        <!-- Shop Panel -->
        <div id="shopPanel" class="hidden">
            <div class="shop-overlay"></div>
            <div class="shop-content">
                <!-- Normal Shop View -->
                <div id="normalShopView">
                    <!-- Header -->
                    <div class="shop-header">
                        <h2 class="font-medieval" id="shopLevelText">Level 2</h2>
                        <button id="shopDoneButton" class="game-button shop-done-btn">Done</button>
                        <div class="shop-gold">
                            <span class="gold-icon">🪙</span>
                            <span id="shopGoldAmount">0</span>
                        </div>
                    </div>

                    <!-- Shop Sections -->
                    <div class="shop-sections" id="shopSections">
                        <!-- Stats Section - Top Row -->
                        <div class="shop-row shop-row-top">
                            <div class="shop-section stats-section" id="statsSection">
                                <button class="section-expand-btn" data-section="stats" title="View Details">Info</button>
                                <h3 class="section-title font-medieval">Stats</h3>
                                <div id="shopStats" class="shop-cards">
                                    <!-- Stat cards populated by JS -->
                                </div>
                            </div>
                        </div>

                        <!-- Bottom Row - Weapons Left, Passives Right -->
                        <div class="shop-row shop-row-bottom">
                            <!-- Weapons Section -->
                            <div class="shop-section weapons-section" id="weaponsSection">
                                <button class="section-expand-btn" data-section="weapons" title="View Details">Info</button>
                                <h3 class="section-title font-medieval">Weapons</h3>
                                <div id="shopWeapons" class="shop-cards">
                                    <!-- Weapon cards populated by JS -->
                                </div>
                            </div>

                            <!-- Passives Section -->
                            <div class="shop-section passives-section" id="passivesSection">
                                <button class="section-expand-btn" data-section="passives" title="View Details">Info</button>
                                <h3 class="section-title font-medieval">Passives</h3>
                                <div id="shopPassives" class="shop-cards">
                                    <!-- Passive cards populated by JS -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Player Inventory Section -->
                    <div class="shop-inventory-section">
                        <h3 class="section-title font-medieval inventory-title">Your Inventory <span class="inventory-hint">(Click to sell)</span></h3>
                        <div id="shopInventory" class="shop-inventory">
                            <!-- Inventory items populated by JS -->
                        </div>
                    </div>

                </div>

                <!-- Expanded Section View (hidden by default, covers entire shop) -->
                <div id="expandedSectionView" class="expanded-section-view hidden">
                    <div class="expanded-header">
                        <button class="section-collapse-btn" id="collapseSectionBtn" title="Back to Shop">Back</button>
                        <h3 class="expanded-section-title font-medieval" id="expandedSectionTitle">Section</h3>
                        <div class="expanded-gold">
                            <span class="gold-icon">🪙</span>
                            <span id="expandedGoldAmount">0</span>
                        </div>
                    </div>
                    <div id="expandedSectionCards" class="expanded-cards">
                        <!-- Extended cards populated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="hidden">
            <h2 class="font-medieval">Defeat</h2>
            <p>All villages have been destroyed. The realm has fallen to darkness.</p>
            <button id="restartButton" class="game-button">Try Again</button>
        </div>

        <!-- Victory Screen -->
        <div id="victoryScreen" class="hidden">
            <h2 class="font-medieval victory-title">Victory!</h2>
            <p>You have destroyed the Dark Castle and saved the realm!</p>
            <button id="victoryRestartButton" class="game-button victory-button">Play Again</button>
        </div>
    </div>

    <!-- Game Script -->
    <script type="module">
        import { Game } from './src/Game.js';

        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('gameCanvas');
            const game = new Game(canvas);

            // Handle window resize
            window.addEventListener('resize', () => game.resize());
        });
    </script>
</body>
</html>
