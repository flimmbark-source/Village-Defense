<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimm Dominion</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Inline critical styles for layout */
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1a1a2e;
            color: #e5e7eb;
        }
        body {
            display: flex;
            flex-direction: column;
            padding: 16px;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            flex-grow: 1;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Game Container -->
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- Hero UI (Bottom Left) -->
        <div id="heroPanel">
            <div class="hero-stats ui-panel">
                <!-- Gold -->
                <div class="stat-row">
                    <span class="stat-label gold font-medieval">Gold</span>
                    <span id="heroGoldText" class="stat-value gold">0</span>
                </div>
                <!-- Health -->
                <div class="stat-row">
                    <span class="stat-label health font-medieval">Health</span>
                    <div class="health-bar-container bar-bg">
                        <div id="heroHealthBar" class="health-bar-fill" style="width: 100%"></div>
                    </div>
                    <span id="heroHealthText">100/100</span>
                </div>
            </div>
        </div>

        <!-- Level Up Panel -->
        <div id="levelUpPanel" class="hidden">
            <div class="level-up-overlay"></div>
            <div class="level-up-content">
                <h2 class="font-medieval" id="levelUpLevelText">Level 2</h2>
                <p>Choose an upgrade:</p>
                <div id="levelUpChoices" class="level-up-choices">
                    <!-- Choices will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="hidden">
            <h2 class="font-medieval">Defeat</h2>
            <p>All villages have been destroyed. The realm has fallen to darkness.</p>
            <button id="restartButton" class="game-button">Try Again</button>
        </div>

        <!-- Victory Screen -->
        <div id="victoryScreen" class="hidden">
            <h2 class="font-medieval victory-title">Victory!</h2>
            <p>You have destroyed the Dark Castle and saved the realm!</p>
            <button id="victoryRestartButton" class="game-button victory-button">Play Again</button>
        </div>

        <!-- Controls hint -->
        <div id="controlsHint" class="ui-panel">
            <span>Click to move | Scroll to zoom</span>
        </div>
    </div>

    <!-- Game Script -->
    <script type="module">
        import { Game } from './src/Game.js';

        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('gameCanvas');
            const game = new Game(canvas);

            // Handle window resize
            window.addEventListener('resize', () => game.resize());
        });
    </script>
</body>
</html>
